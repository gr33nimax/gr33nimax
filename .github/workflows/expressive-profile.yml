name: Expressive Profile
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .profile/polish.mjs
      - .github/workflows/expressive-profile.yml
permissions:
  contents: write
concurrency:
  group: expressive-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned renderer
        uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: f852b8a36dc83923d374b2bcba03652338000049
          path: .expressive-engine
          persist-credentials: false
      - name: Render current GitHub data
        run: node .expressive-engine/action/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Apply HYDRA layout
        run: node .profile/polish.mjs
      - name: Commit updated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md .profile
          if ! git diff --cached --quiet; then
            git commit -m 'Update HYDRA profile'
            git push
          fi
