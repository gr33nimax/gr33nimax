name: Expressive Profile
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml
permissions:
  contents: write
concurrency:
  group: expressive-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metawka/expressive-profile@f852b8a36dc83923d374b2bcba03652338000049
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
